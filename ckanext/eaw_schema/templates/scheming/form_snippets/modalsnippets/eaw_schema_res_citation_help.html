<div class="modal-help">
    <div id="{{ field.modal_text }}" class="modal fade" tabindex="-1" aria-labelledby="{{ field.modal_text }}Label" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <i class="fa fa-lightbulb-o fa-lg"></i>&nbsp;&nbsp;<b>Resource Citation</b>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>
                        If this resource has special requirements with regard to
                        citation, please provide text that can be copied &amp; pasted
                        for that purpose.
                    </p>
                    <div class="alert alert-info" role="alert" style="margin-top:30px;">
                        <p>
                            <i class="fa fa-info-circle"></i> If the citation of this
                            resource is covered by the citation of the whole package, you
                            can leave this field empty.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
